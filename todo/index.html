<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h1>📝 Minha Lista de Tarefas</h1>
            
            <div class="input-container">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Adicionar nova tarefa..."
                    class="todo-input"
                >
                <button id="addBtn" class="add-btn">Adicionar</button>
            </div>

            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="active">Ativas</button>
                <button class="filter-btn" data-filter="completed">Concluídas</button>
            </div>

            <ul id="todoList" class="todo-list"></ul>

            <div class="stats">
                <span id="totalTasks">Total: 0</span>
                <span id="completedTasks">Concluídas: 0</span>
                <button id="clearBtn" class="clear-btn">Limpar Concluídas</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
